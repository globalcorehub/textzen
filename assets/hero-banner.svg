<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="paper-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#paper-bg)" rx="16"/>
  <!-- Swiss Grid Lines -->
  <g stroke="#e7e5e4" stroke-width="1.5">
    <line x1="120" y1="0" x2="120" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" stroke-dasharray="4,4"/>
    <line x1="840" y1="0" x2="840" y2="540" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="420" x2="960" y2="420" />
  </g>
  <!-- Architectural Typography -->
  <text x="160" y="200" fill="#1c1917" font-family="'Plus Jakarta Sans', serif" font-size="64" font-weight="900" letter-spacing="-2">TEXTZEN</text>
  <text x="160" y="250" fill="#78716c" font-family="system-ui, sans-serif" font-size="22" font-weight="500">The Editorial Markdown &amp; Typographic Studio</text>
  <!-- Floating Paper Card Layout -->
  <rect x="520" y="160" width="280" height="220" rx="4" fill="#ffffff" stroke="#1c1917" stroke-width="2" filter="drop-shadow(8px 8px 0px #1c1917)"/>
  <rect x="545" y="195" width="150" height="10" fill="#1c1917"/>
  <rect x="545" y="220" width="230" height="6" fill="#a8a29e"/>
  <rect x="545" y="235" width="210" height="6" fill="#a8a29e"/>
  <rect x="545" y="250" width="180" height="6" fill="#a8a29e"/>
  <rect x="545" y="290" width="90" height="28" rx="2" fill="#2563eb"/>
  <text x="560" y="309" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">COMPOSE</text>
</svg>